<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba MusicXML a PDF</title>
    <!-- Librería de OpenSheetMusicDisplay desde CDN -->
    <script src="opensheetmusicdisplay.min.js"></script>
</head>
<body>
    <h2>Convertidor de MusicXML a PDF (Prueba)</h2>
    <input type="file" id="fileInput" accept=".xml,.musicxml" />

    <script>
        async function loadHtml2Pdf() {
        if (window.html2pdf) return;
        return new Promise((resolve) => {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
            script.onload = resolve;
            document.head.appendChild(script);
        });
        }

        async function convertMusicXmlToPdfAndroid(xmlString, outputFileName = 'partitura.pdf') {
        await loadHtml2Pdf();

        const container = document.createElement('div');
        container.style.width = '800px';
        container.style.background = '#ffffff';
        document.body.appendChild(container);

        const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(container, {
            autoResize: false,
            drawTitle: false,
            drawComposer: false,
            drawFingerings: true,
            fingeringPosition: "left",
            drawStringNumbers: true,
            fingeringInsideStaff: false
        });

        await osmd.load(xmlString);
        osmd.render();

        const options = {
            margin: [15, 10, 15, 10],
            filename: outputFileName,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        await html2pdf().set(options).from(container).save();
        document.body.removeChild(container);
        console.log('✅ PDF generado localmente.');
        }

        // Evento para cargar un archivo desde el PC
        document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const xmlContent = evt.target.result;
            convertMusicXmlToPdfAndroid(xmlContent, 'partitura_pc.pdf');
        };
        reader.readAsText(file);
        });
    </script>
</body>
</html>
